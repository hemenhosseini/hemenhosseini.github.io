---
layout: default
---
<article class="post">
  <header class="page-head">
    <p class="meta">{{ page.date | date: "%-d %B %Y" }}{% if page.tags %} · {{ page.tags | join: " · " }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/articles/' | relative_url }}">← All articles</a></p>
</article>
